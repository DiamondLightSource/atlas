apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
data:
  oauth2_proxy.cfg: |
    email_domains = ["*"]
    cookie_secure = true
    cookie_samesite = "lax"
    cookie_expire = "168h"
    cookie_refresh = "45s"
    cookie_name = "{{ include "oauth2-proxy.fullname" . }}-cookie"
    skip_auth_routes = ["^GET=/($|[^a].*|a$|a[^p].*|ap$|ap[^i].*|api$|api[^/].*)"]
    api_routes = ["^/oauth2", "^/api"]
    skip_provider_button = true
{{ include "ui-base.extraConfig" . | indent 4 }}
