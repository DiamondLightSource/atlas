"""The root mutation of the service"""
type Mutation {
  """submit specific workflow template"""
  submitWorkflowTemplate(name: String!, visit: VisitInput!, parameters: JSON!): Workflow!

  """
  Submit a manifest (YAML) as a one-off Workflow within a visit's namespace.
  
  The input is typically a `WorkflowTemplate` (the manifest developers author and
  store in their repository). It is submitted via the Argo Server API so the graph
  remains the single source of truth for submissions. To match the behaviour of the
  workflows CLI, the manifest is coerced into a one-off Workflow: `kind` is set to
  `Workflow`, and a fixed `metadata.name` is rewritten to a `metadata.generateName`
  (suffixed with `-`) so repeated submissions yield fresh, uniquely named Workflows.
  """
  submitWorkflow(visit: VisitInput!, manifest: String!): Workflow!

  """Create a Trigger from a template"""
  createTrigger(templateRef: String!, name: String, visit: VisitInput): Trigger
  createExperimentDefinition(input: CreateExperimentDefinitionInput!): CreateExperimentDefinitionResponse
  experimentDefinition(id: UUID!): ExperimentDefinitionMutations
  deleteExperiment(id: UUID!): DeleteExperimentResponse
  restoreExperiment(id: UUID!): DeleteExperimentResponse
  deleteExperimentDefinition(id: UUID!): DeletedExperimentDefinitionResponse
  restoreExperimentDefinition(id: UUID!): DeletedExperimentDefinitionResponse
  createInstrumentSession(input: CreateInstrumentSessionInput!): InstrumentSession!
  instrumentSession(proposalNumber: Int!, instrumentSessionNumber: Int!): InstrumentSessionMutations
  createOrValidateSamples(input: CreateOrValidateSampleInput!): CreateSamplesResponse!
  sample(sampleId: UUID!): SampleMutations
  deleteSample(sampleId: UUID!): DeleteSampleResponse!
  restoreSample(sampleId: UUID!): RestoreSampleResponse!

  """Create a new container type"""
  createContainerType(input: CreateContainerTypeInput!): CreateContainerTypeResponse!

  """Mutations relating to a specific container type"""
  containerType(name: String!): ContainerTypeMutations!

  """Create a new container"""
  createContainer(input: CreateContainerInput!): CreateContainerResponse!

  """Muatations relating to a specific container"""
  container(id: UUID = null, barcode: String = null): ContainerMutations!
}

"""Represents Relay Node types"""
union NodeValue = Workflow

