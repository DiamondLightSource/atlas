ui-base:
  name: b21
  host: b21.diamond.ac.uk

  image:
    repository: ghcr.io/diamondlightsource/atlas/b21
    tag: # Updated by CI job with latest release version

  # Note that if these have changed you may need to manually restart the oauth2-proxy pod on deployment
  upstreams:
    - id: blueapi
      path: /api/blueapi/
      rewriteTarget: /
      target:
        external:
          uri: https://b21-blueapi.diamond.ac.uk

    - id: daq-queue
      path: /api/daq-queue/
      rewriteTarget: /
      target:
        external:
          uri: https://b21-daq-queue.diamond.ac.uk

    - id: supergraph
      path: /api/graphql
      rewriteTarget: /graphql
      target:
        external:
          uri: https://graph-nightly.diamond.ac.uk
      passHostHeader: false
