ui-base:
  name: b21
  host: b21.diamond.ac.uk

  image:
    repository: ghcr.io/diamondlightsource/atlas/b21
    tag: # Updated by CI job with latest release version

  upstreams:
    - id: blueapi
      path: /api/blueapi/
      rewriteTarget: /
      target:
        external:
          uri: b21-blueapi.diamond.ac.uk

    - id: tiled
      path: /api/data/
      rewriteTarget: /api/v1/
      target:
        external:
          uri: https://tiled.diamond.ac.uk

    - id: supergraph
      path: /api/supergraph
      rewriteTarget: /graphql
      passHostHeader: false
      target:
        external:
          uri: https://graph.diamond.ac.uk
